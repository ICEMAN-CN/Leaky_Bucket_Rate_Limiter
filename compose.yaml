name: leaky-bucket

x-http-health: &http-health
  test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/livez"]
  interval: 3s
  timeout: 2s
  retries: 15
  start_period: 5s

x-limiter: &limiter
  CAPACITY: ${CAPACITY:-5}
  LEAK_RATE: ${LEAK_RATE:-1.0}
  PORT: "8080"

x-go: &go
  build:
    context: .
    dockerfile: distributed/Dockerfile
  depends_on:
    redis: {condition: service_healthy}
  restart: unless-stopped
  healthcheck:
    <<: *http-health
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]

services:
  clojure:
    build:
      context: .
      dockerfile: standard/Dockerfile
    ports: ["127.0.0.1:${STANDARD_PORT:-8081}:8080"]
    environment:
      <<: *limiter
      INSTANCE_ID: clojure
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=2 -Xmx256m"
    healthcheck:
      <<: *http-health
      start_period: 90s
    restart: unless-stopped
  redis:
    image: redis:7.4.7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes: ["bucket-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped
  go-a:
    <<: *go
    environment:
      <<: *limiter
      INSTANCE_ID: go-a
      REDIS_ADDR: redis:6379
  go-b:
    <<: *go
    environment:
      <<: *limiter
      INSTANCE_ID: go-b
      REDIS_ADDR: redis:6379
  gateway:
    build:
      context: .
      dockerfile: ops/Dockerfile
    ports: ["127.0.0.1:${GO_PORT:-8082}:8080"]
    depends_on:
      go-a: {condition: service_healthy}
      go-b: {condition: service_healthy}
    healthcheck: *http-health
    restart: unless-stopped
  console:
    build:
      context: .
      dockerfile: console/Dockerfile
    ports: ["127.0.0.1:${CONSOLE_PORT:-8080}:8080"]
    depends_on:
      gateway: {condition: service_healthy}
      clojure: {condition: service_healthy}
    healthcheck: *http-health
    restart: unless-stopped
volumes:
  bucket-data:
