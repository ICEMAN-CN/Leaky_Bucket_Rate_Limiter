global
    log stdout format raw local0

defaults
    mode http
    log global
    timeout connect 500ms
    timeout client 10s
    timeout server 3s
    retries 0
    # Return gateway errors as JSON so callers can distinguish them from Redis-backed check failures.
    http-error status 502 content-type application/json string '{"instance":"gateway","error":"bad_upstream_response"}' hdr Cache-Control no-store
    http-error status 503 content-type application/json string '{"instance":"gateway","error":"no_backend_available"}' hdr Cache-Control no-store
    http-error status 504 content-type application/json string '{"instance":"gateway","error":"upstream_timeout"}' hdr Cache-Control no-store

resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s

frontend public
    bind :8080
    default_backend limiters

backend limiters
    balance roundrobin
    option httpchk GET /livez
    http-check expect status 200
    default-server inter 500ms fall 2 rise 1 resolvers docker init-addr last,libc,none
    server go-a go-a:8080 check
    server go-b go-b:8080 check
